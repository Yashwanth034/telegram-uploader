---
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Compile Python sources
        run: python -m py_compile src/bulkuploader/app.py src/bulkuploader/tdlib_native.py src/bulkuploader/secure_store.py src/bulkuploader/paths.py install.py scripts/torture_test.py

      - name: Run deterministic torture test
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python scripts/torture_test.py

      - name: Smoke test self-contained installer (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python install.py
          "$HOME/.local/bin/telegram" --version
          "$HOME/.local/bin/telegram" doctor

      - name: Smoke test self-contained installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python install.py
          & "$env:LOCALAPPDATA\telegram-uploader\bin\telegram.cmd" --version
          & "$env:LOCALAPPDATA\telegram-uploader\bin\telegram.cmd" doctor

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and security tools
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "bandit>=1.8,<2" "pip-audit>=2.9,<3" "ruff>=0.12,<1"

      - name: Run critical correctness lint
        run: python -m ruff check --select E9,F63,F7,F82 src tests install.py scripts

      - name: Scan Python source for medium/high security findings
        run: python -m bandit -q -r src install.py -ll -ii

      - name: Audit installed dependencies
        run: python -m pip_audit

  package:
    name: Package verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build release artifacts
        run: |
          python -m pip install "build>=1,<2" "twine>=6,<7"
          python -m build
          python -m twine check dist/*

      - name: Verify built wheel and CLI version
        shell: bash
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install dist/*.whl
          .release-venv/bin/telegram --version
          .release-venv/bin/python -c "import importlib.metadata as m; from bulkuploader import __version__; from bulkuploader.tdlib_native import APP_VERSION; assert m.version('telegram-uploader') == __version__ == APP_VERSION"
