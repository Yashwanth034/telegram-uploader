name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Compile Python sources
        run: python -m py_compile src/bulkuploader/app.py src/bulkuploader/tdlib_native.py src/bulkuploader/secure_store.py src/bulkuploader/paths.py install.py

      - name: Smoke test self-contained installer (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python install.py
          "$HOME/.local/bin/telegram" doctor

      - name: Smoke test self-contained installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python install.py
          & "$env:LOCALAPPDATA\telegram-uploader\bin\telegram.cmd" doctor

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and security tools
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "bandit>=1.8,<2" "pip-audit>=2.9,<3"

      - name: Scan Python source for medium/high security findings
        run: python -m bandit -q -r src install.py -ll -ii

      - name: Audit installed dependencies
        run: python -m pip_audit
